# Winchy ESP32-S3 firmware workspace. Separate from ../Cargo.toml because it
# builds with the Xtensa `esp` toolchain for xtensa-esp32s3-espidf; the pure
# logic crates in ../crates are shared by path.
[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
esp-idf-svc = "0.53"
log = "0.4"
embuild = "0.33"
winchy-fusion = { path = "../crates/fusion" }
winchy-geo = { path = "../crates/geo" }
winchy-gnss = { path = "../crates/gnss" }
winchy-link = { path = "../crates/link" }
winchy-protocol = { path = "../crates/protocol" }
winchy-axp2101 = { path = "../crates/axp2101" }
winchy-bmp280 = { path = "../crates/bmp280" }
winchy-qmi8658 = { path = "../crates/qmi8658" }
winchy-ads1232 = { path = "../crates/ads1232" }
winchy-tbeam = { path = "../crates/tbeam" }
winchy-sx126x = { path = "../crates/sx126x" }
winchy-board = { path = "crates/board" }
winchy-settings = { path = "crates/settings" }
winchy-storage = { path = "crates/storage" }
winchy-net = { path = "../crates/net" }
winchy-net-esp = { path = "crates/net-esp" }
winchy-provision = { path = "../crates/provision" }
winchy-rope-logic = { path = "../crates/rope-logic" }
winchy-datalog = { path = "../crates/datalog" }

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
# Sensor units are converted to f32 for filters and logs; the values are far
# below 2^23, so the precision loss is nil.
cast_precision_loss = "allow"

[profile.release]
opt-level = "s"
debug = true

[profile.dev]
debug = true
opt-level = "z"
